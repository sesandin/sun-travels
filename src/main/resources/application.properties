
spring.application.name=suntravels-backend

# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/suntravels
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate

# Server
server.port=8080

spring.jpa.open-in-view=false