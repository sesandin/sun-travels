spring.application.name=suntravels-backend
# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/suntravels
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
# Server
server.port=8080
spring.jpa.open-in-view=false
# Session cookies are HttpOnly and same-site. Enable Secure in HTTPS deployments.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Explicit, one-time staff account bootstrap. Disabled by default.
suntravels.auth.bootstrap.enabled=${AUTH_BOOTSTRAP_ENABLED:false}
suntravels.auth.bootstrap.admin-password=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
suntravels.auth.bootstrap.agent-password=${AUTH_BOOTSTRAP_AGENT_PASSWORD:}

# Quiet defaults; business events only. SQL values and request bodies stay unlogged.
logging.level.root=${LOG_ROOT_LEVEL:WARN}
logging.level.com.suntravels=${LOG_APP_LEVEL:INFO}
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.jdbc.core=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
spring.jpa.show-sql=false
logging.pattern.level=%5p [requestId:%X{requestId:-none}]
logging.file.name=${LOG_FILE:logs/suntravels.log}
logging.logback.rollingpolicy.file-name-pattern=${logging.file.name}.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-file-size=${LOG_MAX_FILE_SIZE:10MB}
logging.logback.rollingpolicy.total-size-cap=${LOG_TOTAL_SIZE_CAP:100MB}
logging.logback.rollingpolicy.max-history=${LOG_MAX_HISTORY:7}
logging.logback.rollingpolicy.clean-history-on-start=true

# Separate loopback listener; runtime control requires explicit opt-in and ADMIN + CSRF.
suntravels.logging.runtime-enabled=${RUNTIME_LOGGING_ENABLED:false}
management.server.address=127.0.0.1
management.server.port=${MANAGEMENT_PORT:9091}
management.endpoints.access.default=none
management.endpoint.loggers.access=unrestricted
management.endpoints.web.exposure.include=loggers
management.endpoints.jmx.exposure.exclude=*
