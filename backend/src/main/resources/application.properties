
spring.application.name=suntravels-backend

# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/suntravels
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate

# Server
server.port=8080

spring.jpa.open-in-view=false

# Session cookies are HttpOnly and same-site. Enable Secure in HTTPS deployments.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Explicit, one-time staff account bootstrap. Disabled by default.
suntravels.auth.bootstrap.enabled=${AUTH_BOOTSTRAP_ENABLED:false}
suntravels.auth.bootstrap.admin-password=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
suntravels.auth.bootstrap.agent-password=${AUTH_BOOTSTRAP_AGENT_PASSWORD:}
